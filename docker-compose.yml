version: "3.8"

services:
  backend:
    build: ./backend
    container_name: gold-backend
    restart: unless-stopped
    ports:
      - "8100:8000"   # 宿主机 8100 → 容器 8000（NAS 访问端口）
    volumes:
      - ./backend/data:/app/data          # 数据库持久化
    environment:
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-CHANGE-ME-TO-A-RANDOM-64-CHAR-STRING}
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-admin123}
      - PRICE_FETCH_INTERVAL_SECONDS=${PRICE_FETCH_INTERVAL_SECONDS:-30}

  # Web 前端（Flutter Web 静态页 + nginx 反向代理 /api 到后端）
  # 网页文件已 COPY 进镜像（web/Dockerfile），不依赖 NAS 上的相对路径挂载，避免 403
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: gold-web:local
    container_name: gold-web
    restart: unless-stopped
    ports:
      - "8101:80"         # 宿主机 8101 → 容器 80（Web 访问端口）
    depends_on:
      - backend
